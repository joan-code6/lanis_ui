    <!-- Apply the stored appearance before React mounts to avoid a bright flash in OLED mode. -->
    <script>
      try {
        const mode = localStorage.getItem('lanis_theme_mode');
        const oled = mode === 'oled' || (!mode && localStorage.getItem('lanis_oled_mode') === 'true');
        const storedDark = localStorage.getItem('lanis_dark_mode');
        const dark = oled || mode === 'dark' || (mode !== 'light' && storedDark === null
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : storedDark === 'true');
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('oled', oled);
        document.documentElement.dataset.theme = localStorage.getItem('lanis_theme_color') || 'cyan';
      } catch (_) {
        // Storage may be unavailable in privacy-restricted contexts; React applies the fallback.
      }
    </script>
