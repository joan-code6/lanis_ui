name: Cloudflare deployment

on:
  workflow_run:
    workflows: [Frontend build]
    types: [completed]

permissions: {}

concurrency:
  group: cloudflare-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_repository.id }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
      deployments: write
    steps:
      # Only default-branch code runs in this privileged workflow. Never check
      # out the PR or execute scripts/configuration from its build artifact.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate source run and current commit
        id: source
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const validate = require('./scripts/cloudflare/validate-run.cjs');
            const target = await validate({github, context});
            if (!target) { core.notice('Skipping stale or unrelated build.'); return; }
            for (const [key, value] of Object.entries(target)) core.setOutput(key, String(value));
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.source.outputs.kind != ''
        with:
          node-version: '24'
      - name: Cache trusted deployment downloads
        if: steps.source.outputs.kind != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-deployment-${{ runner.os }}-node24-${{ hashFiles('scripts/cloudflare/tooling/package-lock.json') }}
      - name: Install locked deployment tool separately
        if: steps.source.outputs.kind != ''
        run: |
          mkdir -p "$RUNNER_TEMP/cloudflare-tool"
          cp scripts/cloudflare/tooling/package.json scripts/cloudflare/tooling/package-lock.json "$RUNNER_TEMP/cloudflare-tool/"
          npm ci --prefix "$RUNNER_TEMP/cloudflare-tool" --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.source.outputs.kind != ''
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish static files
        if: steps.source.outputs.kind != ''
        id: publish
        run: node scripts/cloudflare/deploy.cjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1a4a95ea6e17217ddfaf34660aaf25a2
          DEPLOY_KIND: ${{ steps.source.outputs.kind }}
          PR_NUMBER: ${{ steps.source.outputs.pr }}
      - name: Publish deployment link
        if: steps.source.outputs.kind != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DEPLOY_URL: ${{ steps.publish.outputs.url }}
          DEPLOY_KIND: ${{ steps.source.outputs.kind }}
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const url = process.env.DEPLOY_URL;
            const preview = process.env.DEPLOY_KIND === 'preview';
            const {data: deployment} = await github.rest.repos.createDeployment({
              ...context.repo, ref: process.env.SOURCE_SHA, auto_merge: false,
              required_contexts: [], environment: preview ? `preview-pr-${process.env.PR_NUMBER}` : 'production',
              transient_environment: preview, production_environment: !preview,
              description: 'Cloudflare static frontend',
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: deployment.id, state: 'success',
              environment_url: url, log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            await core.summary.addLink(preview ? 'Open PR preview' : 'Open production', url).write();
            if (!preview) return;
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- cloudflare-preview -->';
            const body = `${marker}\nCloudflare preview: ${url}\n\nCommit: \`${process.env.SOURCE_SHA}\`\n\nThis preview uses the live LANIS API. Changes made after signing in affect your real account.`;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number});
            const previous = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number, body});
