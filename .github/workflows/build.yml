name: Frontend build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          # Separate PR/main keys, no fallback keys, and no node_modules cache.
          # GitHub additionally scopes cache writes to the workflow's ref.
          key: npm-frontend-${{ runner.os }}-node24-${{ github.event_name }}-${{ hashFiles('package-lock.json') }}
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and render public HTML
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: https://lanis-backend.joancode.dev
      - name: Check deployment security rules
        run: node --test scripts/cloudflare/*.test.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
